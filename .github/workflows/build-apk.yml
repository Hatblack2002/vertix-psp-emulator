# =============================================================================
# VERTIX PSP Emulator — Build APK con núcleo PPSSPP REAL
# -----------------------------------------------------------------------------
# Este workflow produce el APK con emulación de verdad:
#
#   Job 1 (build-native):
#     1. Clona el código fuente oficial de PPSSPP (master pinneado por SHA) con
#        sus submódulos (ffmpeg, glslang, SPIRV-Cross, armips, miniupnp, zstd...).
#     2. Compila el núcleo nativo real `libppsspp_jni.so` con ndk-build para
#        arm64-v8a y armeabi-v7a (CPU MIPS emulada, GPU GL/Vulkan, audio).
#     3. Publica las librerías como artefacto.
#
#   Job 2 (build-apk):
#     4. Descarga las librerías a app/src/main/jniLibs/<abi>/.
#     5. Compila el APK (assembleDebug) y ejecuta los tests unitarios.
#     6. Publica el APK final como artefacto descargable.
#
# Java 21 es obligatorio para los tests (Robolectric SDK 36 / Android 16).
# =============================================================================

name: Build APK (PPSSPP real)

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
    inputs:
      ppsspp_ref:
        description: 'Ref de PPSSPP a compilar (SHA/tag/branch)'
        required: true
        default: '35e27933ff28bffcf1eadce0574569958d14c9b9'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PPSSPP master pinneado por SHA (ffmpeg precompilado regenerado 2026-07,
  # compatible con lld de NDK moderno; la rama v1.19.3 usaba binarios no-PIC).
  PPSSPP_REF: ${{ github.event.inputs.ppsspp_ref || '35e27933ff28bffcf1eadce0574569958d14c9b9' }}
  # NDK 29 = el que fija el propio PPSSPP en android/build.gradle.kts.
  NDK_VERSION: '29.0.14206865'

jobs:
  # ===========================================================================
  # Job 1: compilar el núcleo nativo real de PPSSPP (libppsspp_jni.so)
  # ===========================================================================
  build-native:
    name: Compile PPSSPP core (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Preparar NDK y licencias del SDK
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/ndk/${NDK_VERSION}" ]; then
            "$SDKMANAGER" --install "ndk;${NDK_VERSION}"
          fi
          echo "NDKBIN=$ANDROID_HOME/ndk/${NDK_VERSION}/ndk-build" >> $GITHUB_ENV

      - name: Clonar PPSSPP ${{ env.PPSSPP_REF }} con submódulos
        run: |
          set -e
          git clone --depth 1 --branch "${{ env.PPSSPP_REF }}" \
            --recurse-submodules --shallow-submodules --jobs 4 \
            https://github.com/hrydgard/ppsspp.git ${{ github.workspace }}/ppsspp
          cd ${{ github.workspace }}/ppsspp
          echo "PPSSPP commit: $(git rev-parse HEAD)"
          ls ffmpeg/android || true

      - name: Caché de objetos de compilación
        uses: actions/cache@v4
        with:
          path: ppsspp/obj
          key: ppsspp-obj-${{ matrix.abi }}-${{ env.PPSSPP_REF }}-ndk${{ env.NDK_VERSION }}

      - name: Compilar libppsspp_jni.so (${{ matrix.abi }})
        run: |
          set -e
          cd ${{ github.workspace }}/ppsspp/android
          "$NDKBIN" -j$(nproc) \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_MODULE_PATH=${{ github.workspace }}/ppsspp/ext \
            APP_ABI=${{ matrix.abi }} \
            ppsspp_jni
          ls -lh libs/${{ matrix.abi }}/

      - name: Verificar símbolos JNI exportados
        run: |
          set -e
          SO=${{ github.workspace }}/ppsspp/android/libs/${{ matrix.abi }}/libppsspp_jni.so
          test -f "$SO"
          ls -lh "$SO"
          readelf -Ws "$SO" | grep -c "Java_org_ppsspp_ppsspp_" || {
            echo "::error::El .so no exporta el puente JNI de PPSSPP"; exit 1; }

      - name: Subir libppsspp_jni.so (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-jni-${{ matrix.abi }}
          path: ppsspp/android/libs/${{ matrix.abi }}/libppsspp_jni.so
          retention-days: 30
          compression-level: 6

  # ===========================================================================
  # Job 2: empaquetar el APK con el núcleo real + tests
  # ===========================================================================
  build-apk:
    name: Build APK + Tests
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 (Robolectric SDK 36 exige Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Descargar libppsspp_jni.so (todas las ABIs)
        uses: actions/download-artifact@v4
        with:
          pattern: ppsspp-jni-*
          path: app/src/main/jniLibs
          merge-multiple: false

      - name: Colocar librerías nativas por ABI
        run: |
          set -e
          # download-artifact crea ppsspp-jni-<abi>/{libppsspp_jni.so}
          # Reorganiza a jniLibs/<abi>/libppsspp_jni.so
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          find app/src/main/jniLibs -name "libppsspp_jni.so" -exec ls -lh {} \;
          cp app/src/main/jniLibs/ppsspp-jni-arm64-v8a/libppsspp_jni.so app/src/main/jniLibs/arm64-v8a/
          cp app/src/main/jniLibs/ppsspp-jni-armeabi-v7a/libppsspp_jni.so app/src/main/jniLibs/armeabi-v7a/
          ls -lh app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a

      - name: Compilar APK debug y ejecutar tests
        run: |
          set -e
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain

      - name: Verificar que el APK contiene el núcleo real
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libppsspp_jni.so"
          unzip -l "$APK" | grep "lib/armeabi-v7a/libppsspp_jni.so"
          unzip -l "$APK" | grep "assets/ui_atlas.zim"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: vertix-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          compression-level: 0

  # ===========================================================================
  # Job 3: resumen
  # ===========================================================================
  report:
    name: Resumen
    needs: [build-native, build-apk]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generar resumen
        run: |
          echo "## VERTIX — APK con núcleo PPSSPP real" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Núcleo PPSSPP (${{ env.PPSSPP_REF }}) | ${{ needs.build-native.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK + Tests | ${{ needs.build-apk.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descarga el artefacto **vertix-apk-debug** para instalar la app." >> $GITHUB_STEP_SUMMARY

      - name: Fallar si alguna etapa falló
        if: ${{ needs.build-native.result != 'success' || needs.build-apk.result != 'success' }}
        run: |
          echo "::error::El pipeline falló en una o más etapas"
          exit 1
