# =============================================================================
# VERTIX PSP Emulator — Build & Test APK
# -----------------------------------------------------------------------------
# Compila el APK en modo debug y ejecuta los tests unitarios ANTES de permitir
# el push a la rama principal. Sube el APK resultante como artifact descargable.
#
# Disparadores:
#   * push a main / develop / release/*
#   * pull_request a main
#   * workflow_dispatch (manual)
#
# Requisitos del runner:
#   - Ubuntu 22.04 (ubuntu-latest)
#   - Java 17 (requerido por AGP 9.x)
#   - Android SDK 36 + NDK 27 + CMake 3.22.1
# =============================================================================

name: Build APK

on:
  push:
    branches: [main, develop, 'release/*']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build (debug o release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# Evita ejecuciones concurrentes duplicadas en la misma rama.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo lectura del contenido.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # Job 1: Compilación + Tests unitarios
  # ===========================================================================
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Si el repo usa submódulos (PPSSPP Core en el futuro), descomenta:
          # submodules: recursive
          # token: ${{ secrets.PAT_TOKEN }}

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # -------------------------------------------------------------------------
      # SDK + NDK + CMake: invocamos sdkmanager por ruta completa.
      # En ubuntu-latest, sdkmanager NO está en PATH; vive en
      # $ANDROID_HOME/cmdline-tools/<version>/bin/sdkmanager (la versión cambia,
      # era 16.0 en runners recientes). Lo localizamos dinámicamente.
      # -------------------------------------------------------------------------
      - name: Aceptar licencias SDK e instalar componentes
        run: |
          set -e
          # Localizar sdkmanager (puede estar en cmdline-tools/latest o en una
          # versión numerada). Tomamos el primero que encontremos.
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager no encontrado en $ANDROID_HOME/cmdline-tools"
            ls -la "$ANDROID_HOME/cmdline-tools/" 2>/dev/null || true
            exit 1
          fi
          echo "Usando sdkmanager: $SDKMANAGER"
          # Aceptar licencias (yes responde a todos los prompts).
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Instalar cada paquete como argumento separado.
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          # Verificación de que los componentes quedaron instalados.
          ls -la "$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake"
          ls -la "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Validar Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle y konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NDK y CMake
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/*
            ${{ env.ANDROID_HOME }}/cmake/*
            ~/.android/caches
            app/.cxx
            app/build
          key: ${{ runner.os }}-ndk-cmake-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-ndk-cmake-

      - name: Conceder permiso de ejecución al wrapper
        run: chmod +x ./gradlew

      # -------------------------------------------------------------------------
      # Paso crítico: compilar el núcleo nativo C++ (libvertix_core.so).
      # Si CMake falla, el workflow se detiene antes de empaquetar el APK.
      # -------------------------------------------------------------------------
      - name: Compilar núcleo nativo C++ (libvertix_core.so)
        run: |
          CMAKE_BIN="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          TOOLCHAIN="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake"
          echo "::group::Configuración CMake"
          "$CMAKE_BIN" \
            -S app/src/main/cpp \
            -B app/.cxx/debug/arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Debug
          echo "::endgroup::"
          echo "::group::Compilación C++"
          "$CMAKE_BIN" \
            --build app/.cxx/debug/arm64-v8a \
            --target vertix_core \
            -- -j"$(nproc)"
          echo "::endgroup::"
          echo "::group::Verificar libvertix_core.so generada"
          find app/.cxx -name "libvertix_core.so" -exec ls -lh {} \;
          echo "::endgroup::"

      # -------------------------------------------------------------------------
      # Tests unitarios + Robolectric. Si fallan, el workflow se detiene
      # ANTES de empaquetar el APK (gate de calidad).
      # -------------------------------------------------------------------------
      - name: Ejecutar tests unitarios
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Publicar reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # -------------------------------------------------------------------------
      # Compilar el APK. La variable BUILD_TYPE controla debug o release.
      # El modo release requiere keystore; en CI solo se firma con debug.
      # -------------------------------------------------------------------------
      - name: Compilar APK (${{ github.event.inputs.build_type || 'debug' }})
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Listar APKs generados
        run: |
          echo "::group::Artefactos APK"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          echo "::endgroup::"

      # -------------------------------------------------------------------------
      # Subir el APK como artifact (descargable desde la UI de Actions).
      #retención: 14 días para no saturar el almacen del repo.
      # -------------------------------------------------------------------------
      - name: Subir APK (debug)
        if: success() && (github.event.inputs.build_type != 'release')
        uses: actions/upload-artifact@v4
        with:
          name: vertix-psp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0  # El APK ya está comprimido

      - name: Subir APK (release)
        if: success() && (github.event.inputs.build_type == 'release')
        uses: actions/upload-artifact@v4
        with:
          name: vertix-psp-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # -------------------------------------------------------------------------
      # Subir los símbolos de debug del núcleo nativo (útil para Crashlytics
      # y para diagnosticar coredumps del backend C++).
      # -------------------------------------------------------------------------
      - name: Subir símbolos nativos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vertix-native-symbols
          path: |
            app/.cxx/**/*.so
            app/build/intermediates/cmake/*/obj/**/*.so
          if-no-files-found: ignore
          retention-days: 30

  # ===========================================================================
  # Job 2: Lint estático (detached para no bloquear el build)
  # ===========================================================================
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Aceptar licencias SDK e instalar componentes (lint)
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager no encontrado"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-lint-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-lint-

      - name: Conceder permiso de ejecución al wrapper
        run: chmod +x ./gradlew

      - name: Ejecutar Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Publicar reporte de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7
